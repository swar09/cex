[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
domain       = { path = "../../packages/domain" }
engine       = { path = "../../packages/engine" }
workers      = { path = "../../packages/workers" }
cache        = { path = "../../packages/cache" }
gateway      = { path = "../../packages/gateway" }
risk         = { path = "../../packages/risk" }
queue        = { path = "../../packages/queue" }
fxhash       = "0.2"
tokio        = { version = "1.53.1", features = ["full"] }
axum         = { version = "0.8.9", features = ["ws"] }
disruptor    = "4.4.0"
redis        = { version = "1.7.0", features = ["aio", "connection-manager", "tokio-comp"] }
rdkafka      = "0.39.0"
core_affinity = "0.8"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
log          = "0.4"
env_logger   = "0.11"
