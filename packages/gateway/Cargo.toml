[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
cache = { version = "0.1.0", path = "../cache" }
engine = { version = "0.1.0", path = "../engine" }
domain = { version = "0.1.0", path = "../domain" }
tokio = { version = "1.53.1", features = ["net", "io-util"] }
futures-util = "0.3.34"
serde_json = "1.0.151"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
uuid = { version = "1.26.1", features = ["serde"] }
jsonwebtoken = "11.1.0"
serde = "1.0.229"
disruptor = "4.4.0"
bincode = "1.3"

