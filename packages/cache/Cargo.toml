[package]
name = "cache"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { version = "0.1.0", path = "../domain" }
jsonwebtoken = "11.1.0"
redis = { version = "1.7.0", features = ["aio", "connection-manager", "tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["serde"] }
tokio = { version = "1.53.1", features = ["net", "io-util"] }
