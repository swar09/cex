[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = "0.12.6"
fastrand = "2.5"
http-body-util = "0.1"
hyper-util = { version = "0.1.21", features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
redis = { version = "1.7.0", features = [
    "aio",
    "connection-manager",
    "tokio-comp",
] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "tracing"] }
toml = "0.8"
tower = "0.5.3"
tracing = "0.1"
uuid = { version = "1.28.0", features = ["serde", "v4", "v7"] }
validator = { version = "0.21.0", features = ["derive"] }
