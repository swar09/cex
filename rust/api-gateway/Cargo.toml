[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = "0.12.6"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
redis = { version = "1.7.0", features = [
    "aio",
    "connection-manager",
    "tokio-comp",
] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "tracing"] }
tower = "0.5.3"
uuid = "1.28.0"
