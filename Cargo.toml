[workspace]
resolver = "2"
members = [
    "rust/matching-engine/bin/server",
    "rust/matching-engine/domain",
    "rust/matching-engine/engine",
    "rust/matching-engine/gateway",
    "rust/matching-engine/cache",
    "rust/matching-engine/workers",
    "rust/matching-engine/risk",
    "rust/matching-engine/queue", "rust/api-gateway",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
